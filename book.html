<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Story 💕</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="music" loop autoplay>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<h2 class="ribbon">🎀 Our Love Book 🎀</h2>

<div class="book" id="book">

  <!-- Cover -->
  <div class="page" style="z-index:7">
    <h2>For You ❤️</h2>
    <p>You are the most beautiful part of my life 💖</p>
  </div>

  <!-- Pages -->
  <div class="page" style="z-index:6">
    <img src="img1.jpg"><p>You are my sunshine ☀️</p>
  </div>

  <div class="page" style="z-index:5">
    <img src="img2.jpg"><p>Your smile melts my heart 💕</p>
  </div>

  <div class="page" style="z-index:4">
    <img src="img3.jpg"><p>Every moment is special 💫</p>
  </div>

  <div class="page" style="z-index:3">
    <img src="img4.jpg"><p>You complete me ❤️</p>
  </div>

  <div class="page" style="z-index:2">
    <img src="img5.jpg"><p>Forever with you 💍</p>
  </div>

  <div class="page" style="z-index:1">
    <img src="img6.jpg"><p>Endless love 💞</p>
  </div>

</div>

<button class="next-btn" onclick="turnPage()">➜</button>

<div id="outro" class="hidden">
  <h1 class="final-text">
    Thank You For Being In My Life 💖<br>
    You Are My Forever & Always 🌍❤️
  </h1>
</div>

<script src="script.js"></script>
</body>
</html>
