<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAANU 😚❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="center">
  <h1 class="welcome">Hey JAANU😚🎀</h1>

  <div class="btns">
    <button class="circle" onclick="toggleMusic()">🎵</button>
    <button class="circle" onclick="goNext()">➜</button>
  </div>
</div>

<script>
let music = document.getElementById("music");

// music memory
if(localStorage.getItem("playMusic")=="yes"){
  music.play();
}

function toggleMusic(){
  if(music.paused){
    music.play();
    localStorage.setItem("playMusic","yes");
  }else{
    music.pause();
    localStorage.setItem("playMusic","no");
  }
}

// IMPORTANT FIX
function goNext(){
  window.location.href = "book.html";
}
</script>

</body>
</html>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
